[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "style-compiler"
version = "0.2.1"
description = "Statistical analysis and evidence compilation for the Mathematician Humanizer writing skill"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parser = ["stanza==1.10.1"]

[project.scripts]
style-compiler = "style_compiler.cli:main"
style-compiler-english = "style_compiler.english:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"style_compiler.linguistic" = ["UNICODE-LICENSE.txt"]
